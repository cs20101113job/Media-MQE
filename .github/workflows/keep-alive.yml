name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Streamlit App
        run: |
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" https://viwebrtceng.streamlit.app/)
          echo "Response HTTP Status Code: $HTTP_STATUS"

          # 正確的 if-else 語法
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 303 ]; then
            echo "App is awake and healthy!"
          else
            echo "Warning: App returned status $HTTP_STATUS"
          fi
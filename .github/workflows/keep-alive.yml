name: Streamlit Keep Alive

on:
  schedule:
    # Run once per hour to keep the app active.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Streamlit App
        run: |
          # A redirect to Streamlit authentication is not proof that the app is awake.
          HTTP_STATUS=$(curl -sS --max-redirs 0 --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" https://viwebrtceng.streamlit.app/)
          echo "Response HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "App endpoint returned HTTP 200."
          elif [ "$HTTP_STATUS" = "303" ]; then
            echo "::error::Streamlit returned an authentication/wake redirect (HTTP 303). This HTTP-only check cannot wake a sleeping app; open the app and use its wake button, or host it on an always-on service."
            exit 1
          else
            echo "::error::App endpoint returned HTTP $HTTP_STATUS."
            exit 1
          fi